name: CS102 Workflow

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pygame black isort mypy pylint
      - name: Run isort
        run: |
          isort --check-only --diff homework01
      - name: Run black
        run: |
          black -l 120 --check --diff --color --exclude "test*" homework01
      - name: Run mypy
        run: |
          mypy --ignore-missing-imports homework01
      - name: Run pylint
        run: |
          pylint --disable=missing-docstring --variable-rgx="[a-z0-9_]{1,30}$" --argument-rgx="[a-z_][a-z0-9_]*$" --ignore-patterns="test*" homework01
      - name: Run unittests
        run: |
          python -m unittest discover homework01
